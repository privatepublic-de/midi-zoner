<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script>require('./dist/renderer/app.js');</script>
    <title>midi-zoner</title>
  </head>

  <body>
    <section id="midisettings">
      <div class="left">
        <div class="toolbar">
          <a id="load" class="lightButton"
            ><i class="material-icons">folder_open</i> Load</a
          >
          <a id="save" class="lightButton"
            ><i class="material-icons">archive</i> Save</a
          >
        </div>
        <a id="allMuteOff" class="lightButton" title="Enable all"
          ><span class="material-icons"> check </span></a
        >
        <a id="allSoloOff" class="lightButton" title="Un-solo all">S</a>
        <a id="allHoldOff" class="lightButton" title="All arpeggiator hold off"
          >H</a
        >
      </div>
      <div id="arrangementIndicator" data-arr="0" title="Active arrangement">A</div>
      <div class="controls" id="controls">
        <div class="row">
          <label>In:</label>
          <span id="midiInputSelector">Choose inputs</span>
        </div>
        <div class="row clocksettings">
          <label for="midiClockInDeviceId">Clock:</label>
          <select id="midiClockInDeviceId" tabindex="-1">
            <option>(No devices)</option>
          </select>
          <div class="" title="Select clock output ports" id="clockSendButton">
            <i class="material-icons">query_builder</i>
            <i class="material-icons">keyboard_double_arrow_right</i>
            <span id="clockOutPortsCount">-</span>
          </div>
          <div
            id="startClockButton"
            class="toggle internal"
            title="Start arpeggiators & sequencers"
          ></div>
          <div class="internal">
            <label for="bpm">BPM:</label>
            <input
              type="number"
              value="120"
              min="30"
              max="240"
              id="bpm"
              tabindex="-1"
            />
          </div>
        </div>
      </div>
      <div class="right">
        <a id="shuffleColors" class="lightButton" title="Shuffle colors"
          ><i class="material-icons">palette</i></a
        >
        <a
          id="midiPanic"
          class="lightButton"
          title="Send 'All notes off' to all outputs"
        >
          Panic
        </a>
      </div>
    </section>
    <div class="padded">
      <section id="zones">
        <div class="zone initialising">INITIALIZING ...</div>
      </section>
    </div>
    <div id="tools">
      <a id="newzone" class="tb-button" title="Add new zone">+ Add zone</a>
      <a id="deleteallzones" class="tb-button" title="Delete all zones">
        Delete all
      </a>
      <div style="margin-left: 6px">Arr:</div>
      <div class="selectSeq sqlA selected" data-select-arrangement="0">A</div>
      <div class="selectSeq sqlB" data-select-arrangement="1">B</div>
      <div class="selectSeq sqlC" data-select-arrangement="2">C</div>
      <div class="selectSeq sqlD" data-select-arrangement="3">D</div>
      <div>Quant:</div>
      <div>
        <select id="seqquant">
          <option value="2">4/4</option>
          <option value="3">3/4</option>
          <option value="8">1/4</option>
          <option value="14">1/16</option>
        </select>
      </div>
      <label class="tb-label" title="When enabled, notes 0–15 (C-1 to D#0) act as zone-mute and sequencer-toggle key switches instead of being routed to zones">
        <input type="checkbox" id="keySwitchEnabled" checked tabindex="-1" /> Key switches
      </label>
    </div>
    <div id="inputPortWindow">
      <div id="inputPortList"></div>
    </div>
    <div id="clockOutPortWindow">
      <div id="clockOutPortList"></div>
      <p class="selectWindowHint">
        All clock and start/stop messages are forwarded to the selected ports.
      </p>
      <p class="selectWindowHint">
        Send clock<br />
        <input
          type="radio"
          name="sendinternal"
          value="0"
          id="sendinternalalways"
          tabindex="-1"
        />
        <label for="sendinternalalways">Always</label>
        <input
          type="radio"
          name="sendinternal"
          value="1"
          id="sendinternalplaying"
          tabindex="-1"
        />
        <label for="sendinternalplaying">Only when playing</label>
      </p>
    </div>
    <div id="toast">
      <div class="toastinner">This is the toast message!</div>
    </div>
    <menu id="contextmenu"></menu>
    <a id="valueUp" href="#" class="valuebtn preventLeave">
      <svg height="20" width="8" xmlns="http://www.w3.org/2000/svg">
        <polygon points="6,11 0,6 0,16" style="fill: #ffffff" />
      </svg>
    </a>
    <a id="valueDown" href="#" class="valuebtn preventLeave"
      ><svg height="20" width="8" xmlns="http://www.w3.org/2000/svg">
        <polygon points="2,11 8,6 8,16" style="fill: #ffffff" />
      </svg>
    </a>
  </body>
</html>
