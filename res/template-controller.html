<div
  class="ccpot ${ cc.type == 2 ? 'spacer' : '' }"
  id="pot_${zoneindex}_${ix}"
  title="Double-click to edit"
>
  <div class="cclabel">${esc(cc.label)}</div>
  <div class="rotary ccpotcontroller">
    <svg
      width="56"
      height="56"
      viewBox="0 0 56 56"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path id="pot_${zoneindex}_${ix}_range" class="knob-track" d="" fill="none" />
      <path id="pot_${zoneindex}_${ix}_value" class="knob-value" d="" fill="none" />
      <path id="pot_${zoneindex}_${ix}_discrete" class="knob-ticks" d="" fill="none" />
      <rect id="pot_${zoneindex}_${ix}_zero" class="knob-zero" x="27" y="9" width="2" height="7" />
    </svg>
    <span class="value">127</span>
    <span class="valuename"></span>
  </div>
  <div class="buttons ccpotcontroller">
    <div class="ccbtn ccbtn0" data-action="${zoneindex}:cc_button_trig:${ix}:0">
      1
    </div>
    <div class="ccbtn ccbtn1" data-action="${zoneindex}:cc_button_trig:${ix}:1">
      2
    </div>
    <div class="ccbtn ccbtn2" data-action="${zoneindex}:cc_button_trig:${ix}:2">
      3
    </div>
    <div class="ccbtn ccbtn3" data-action="${zoneindex}:cc_button_trig:${ix}:3">
      4
    </div>
    <div class="ccbtn ccbtn4" data-action="${zoneindex}:cc_button_trig:${ix}:4">
      5
    </div>
    <div class="ccbtn ccbtn5" data-action="${zoneindex}:cc_button_trig:${ix}:5">
      6
    </div>
    <div class="ccbtn ccbtn6" data-action="${zoneindex}:cc_button_trig:${ix}:6">
      7
    </div>
    <div class="ccbtn ccbtn7" data-action="${zoneindex}:cc_button_trig:${ix}:7">
      8
    </div>
  </div>
  <div class="selector ccpotcontroller">
    <div class="selector-name" title="Click for the list, drag or scroll to step through it"><span></span></div>
    <div class="selector-steps">
      <span class="selector-step material-icons" data-action="${zoneindex}:cc_step:${ix}:-1" title="Previous">chevron_left</span>
      <span class="selector-pos"></span>
      <span class="selector-step material-icons" data-action="${zoneindex}:cc_step:${ix}:1" title="Next">chevron_right</span>
    </div>
  </div>
  <div class="info ccpotcontroller"></div>
</div>
